<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Helvetica,Arial,sans-serif">
<style>
.b{fill:#0b0b0b;stroke:#2dd4bf;stroke-width:1.5}.t{fill:#e5e5e5;font-size:13px;text-anchor:middle}.s{fill:#8a8a8a;font-size:10.5px;text-anchor:middle}.h{fill:#2dd4bf;font-size:12px;text-anchor:middle}
.l{stroke:#005f61;stroke-width:2;fill:none;stroke-dasharray:6 6;animation:d 1.2s linear infinite}@keyframes d{to{stroke-dashoffset:-12}}
.a{animation:p 12s ease-in-out infinite}@keyframes p{0%,100%{opacity:.35}8%{opacity:1}16%{opacity:.35}}
.g{stroke:#f59e0b}
</style>
<rect width="1000" height="380" fill="#000" rx="14"/>
<text x="500" y="26" class="t" style="font-size:18px">Backend RCA flow: resolved incident to Box</text>
<text x="500" y="52" class="h">Worker: background, scheduled</text>
<rect x="20" y="64" width="150" height="56" rx="10" class="b a"/><text x="95" y="88" class="t">Scheduler</text><text x="95" y="106" class="s">enqueue sync job</text>
<rect x="210" y="64" width="150" height="56" rx="10" class="b a" style="animation-delay:1s"/><text x="285" y="88" class="t">ServiceNow sync</text><text x="285" y="106" class="s">limiter + breaker</text>
<rect x="400" y="64" width="150" height="56" rx="10" class="b a" style="animation-delay:2s"/><text x="475" y="88" class="t">Postgres upsert</text><text x="475" y="106" class="s">status: Needs RCA</text>
<rect x="590" y="64" width="150" height="56" rx="10" class="b a" style="animation-delay:3s"/><text x="665" y="88" class="t">Embed jobs</text><text x="665" y="106" class="s">pgvector chunks</text>
<path class="l" d="M170 92H210M360 92H400M550 92H590"/>
<text x="500" y="160" class="h">API: interactive, streamed</text>
<rect x="20" y="172" width="150" height="56" rx="10" class="b a" style="animation-delay:4s"/><text x="95" y="196" class="t">GET incidents</text><text x="95" y="214" class="s">read from Postgres</text>
<rect x="210" y="172" width="150" height="56" rx="10" class="b a" style="animation-delay:5s"/><text x="285" y="196" class="t">POST draft</text><text x="285" y="214" class="s">Advisor + RAG</text>
<rect x="400" y="172" width="150" height="56" rx="10" class="b a" style="animation-delay:6s"/><text x="475" y="196" class="t">vLLM</text><text x="475" y="214" class="s">structured template</text>
<rect x="590" y="172" width="150" height="56" rx="10" class="b a" style="animation-delay:7s"/><text x="665" y="196" class="t">Save Draft</text><text x="665" y="214" class="s">AI-filled fields marked</text>
<path class="l" d="M170 200H210M360 200H400M550 200H590"/>
<rect x="780" y="172" width="200" height="56" rx="10" class="b g a" style="animation-delay:8s"/><text x="880" y="196" class="t">Human review</text><text x="880" y="214" class="s">engineer edits, approves</text>
<path class="l" d="M740 200H780"/>
<text x="500" y="268" class="h">Back to the worker</text>
<rect x="590" y="280" width="150" height="56" rx="10" class="b a" style="animation-delay:9s"/><text x="665" y="304" class="t">Queue upload</text><text x="665" y="322" class="s">status: Approved</text>
<rect x="400" y="280" width="150" height="56" rx="10" class="b a" style="animation-delay:10s"/><text x="475" y="304" class="t">Build .docx</text><text x="475" y="322" class="s">exact template</text>
<rect x="210" y="280" width="150" height="56" rx="10" class="b a" style="animation-delay:11s"/><text x="285" y="304" class="t">Box upload</text><text x="285" y="322" class="s">retry + idempotent</text>
<rect x="20" y="280" width="150" height="56" rx="10" class="b a" style="animation-delay:11.5s"/><text x="95" y="304" class="t">In Box</text><text x="95" y="322" class="s">box_url saved</text>
<path class="l" d="M880 228 V256 H665 V280"/><path class="l" d="M590 308H550M400 308H360M210 308H170"/>
<circle r="5" fill="#2dd4bf"><animateMotion dur="12s" repeatCount="indefinite" path="M20 92 L665 92 L95 200 L880 200 L665 308 L95 308"/></circle>
</svg>
