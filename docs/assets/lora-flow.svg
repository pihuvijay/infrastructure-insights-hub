<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="Helvetica,Arial,sans-serif">
<style>
.b{fill:#0b0b0b;stroke:#2dd4bf;stroke-width:1.5}.t{fill:#e5e5e5;font-size:13px;text-anchor:middle}.s{fill:#8a8a8a;font-size:10.5px;text-anchor:middle}.h{fill:#2dd4bf;font-size:12px;text-anchor:middle}
.l{stroke:#005f61;stroke-width:2;fill:none;stroke-dasharray:6 6;animation:d 1.2s linear infinite}@keyframes d{to{stroke-dashoffset:-12}}
.a{animation:p 10s ease-in-out infinite}@keyframes p{0%,100%{opacity:.35}10%{opacity:1}20%{opacity:.35}}
</style>
<rect width="1000" height="340" fill="#000" rx="14"/>
<text x="500" y="26" class="t" style="font-size:18px">Fine-tuning: LoRA adapter on Llama 3.1</text>
<text x="500" y="52" class="h">Train (laptop CPU for a smoke test, rented NVIDIA GPU for Llama 3.1 8B)</text>
<rect x="20" y="66" width="160" height="60" rx="10" class="b a"/><text x="100" y="92" class="t">Approved RCAs</text><text x="100" y="110" class="s">Box .docx + SNOW ticket</text>
<rect x="220" y="66" width="160" height="60" rx="10" class="b a" style="animation-delay:1.2s"/><text x="300" y="92" class="t">rcas.jsonl</text><text x="300" y="110" class="s">prompt / response pairs</text>
<rect x="420" y="66" width="160" height="60" rx="10" class="b a" style="animation-delay:2.4s"/><text x="500" y="92" class="t">train_lora.py</text><text x="500" y="110" class="s">QLoRA, rank 16</text>
<rect x="620" y="66" width="160" height="60" rx="10" class="b a" style="animation-delay:3.6s"/><text x="700" y="92" class="t">LoRA adapter</text><text x="700" y="110" class="s">small, base unchanged</text>
<rect x="820" y="66" width="160" height="60" rx="10" class="b a" style="animation-delay:4.8s"/><text x="900" y="92" class="t">Evals</text><text x="900" y="110" class="s">template + citations</text>
<path class="l" d="M180 96H220M380 96H420M580 96H620M780 96H820"/>
<text x="500" y="176" class="h">Serve</text>
<rect x="160" y="190" width="200" height="60" rx="10" class="b a" style="animation-delay:6s"/><text x="260" y="216" class="t">vLLM, VM 4 (GPU)</text><text x="260" y="234" class="s">--enable-lora</text>
<rect x="400" y="190" width="200" height="60" rx="10" class="b a" style="animation-delay:7.2s"/><text x="500" y="216" class="t">model="rca"</text><text x="500" y="234" class="s">OpenAI-compatible API</text>
<rect x="640" y="190" width="200" height="60" rx="10" class="b a" style="animation-delay:8.4s"/><text x="740" y="216" class="t">Advisor drafts RCA</text><text x="740" y="234" class="s">with RAG context</text>
<path class="l" d="M900 126 V160 H260 V190"/><path class="l" d="M360 220H400M600 220H640"/>
<text x="500" y="296" class="s">LoRA teaches style and template. RAG supplies the knowledge. A person approves before Box.</text>
<circle r="5" fill="#2dd4bf"><animateMotion dur="10s" repeatCount="indefinite" path="M20 96 L900 96 L900 160 L260 160 L260 220 L740 220"/></circle>
</svg>
